name: EcoTwin compatibility

on:
  pull_request:
  push:
    branches: [main, develop, 'codex/**']
  workflow_dispatch:

jobs:
  optional-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=optional
      - name: Check ownership and reviewed upstream patch
        run: |
          python3 distributions/symphony-ecotwin/compatibility/check_architecture.py
          python3 distributions/symphony-ecotwin/compatibility/test_architecture.py
          python3 distributions/symphony-ecotwin/compatibility/test_upstream.py
          python3 distributions/symphony-ecotwin/compatibility/rehearse_upstream.py
      - name: Prove base builds without plugin source
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 distributions/symphony-ecotwin/compatibility/verify_absent.py
      - name: Build and test enabled frontend
        working-directory: frontend
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          npm run test:ecotwin-core
          npm run test:ecotwin
          npm run lint:ecotwin
          npm run build:ecotwin
          npm run build:ecotwin-absent
      - name: Build and test enabled backend
        run: mvn -B -f distributions/symphony-ecotwin/backend/pom.xml -Pecotwin,skip-apitests package
      - name: Build base backend for deployment comparison
        run: mvn -B -f symphony-ws/pom.xml -Pskip-apitests package
      - name: Verify container lifecycle and plugin omission
        run: |
          python3 -m pip install uv==0.5.9
          python3 distributions/symphony-ecotwin/verification/run.py \
            --base-war symphony-ws/target/base/symphony-ws-1.26.0-SNAPSHOT.war \
            --enabled-war symphony-ws/target/ecotwin/symphony-ws-1.26.0-SNAPSHOT.war \
            --output .local/plugin-verification/container
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecotwin-compatibility-evidence
          path: .local/plugin-verification/
          if-no-files-found: ignore

  upstream-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci --include=optional
        working-directory: frontend
      - name: Rebuild both distributions on pristine supported upstream
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 distributions/symphony-ecotwin/compatibility/rehearse_upstream.py --build
